{% extends "layout.html" %}

{% block extra_css %}
<style>
    .main-container-ocr {
        height: calc(100vh - 80px);
        display: flex;
        flex-direction: column;
        background: white;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        overflow: hidden;
    }

    .toolbar {
        padding: 10px;
        background-color: #f8f9fa;
        border-bottom: 1px solid #dee2e6;
    }

    .content-area {
        flex: 1;
        display: flex;
        overflow: hidden;
    }

    .pdf-panel {
        flex: 1;
        border-right: 1px solid #dee2e6;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .editor-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 15px;
        background-color: #fff;
    }

    .page-selector {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        padding: 10px;
        background: #f8f9fa;
        border-bottom: 1px solid #dee2e6;
        overflow-y: auto;
        min-height: 50px;
        max-height: 120px;
    }
    
    .pdf-viewer-container {
        flex: 1;
        overflow: auto;
        min-height: 0;  /* Important for flex children */
    }

    .page-btn {
        padding: 5px 10px;
        border: 1px solid #dee2e6;
        background: white;
        cursor: pointer;
        border-radius: 4px;
        transition: all 0.2s;
    }

    .page-btn:hover {
        background: #e9ecef;
    }

    .page-btn.active {
        background: #4f46e5;
        color: white;
        border-color: #4f46e5;
    }

    .page-btn.has-content {
        font-weight: bold;
    }

    #markdown-editor {
        flex: 1;
        width: 100%;
        font-family: monospace;
        font-size: 0.85rem;
        border: 1px solid #ced4da;
        border-radius: 0.25rem;
        padding: 10px;
        resize: none;
        overflow-y: auto;
    }

    #markdown-preview {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        border: 1px solid #ced4da;
        border-radius: 0.25rem;
        display: none;
        background-color: #f8f9fa;
        font-family: system-ui, -apple-system, sans-serif;
    }

    .action-bar {
        display: flex;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid #dee2e6;
    }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']],
            processEscapes: true
        }
    };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endblock %}

{% block content %}
<div class="main-container-ocr">
    <!-- Toolbar -->
    <div class="toolbar d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-3">
            <h5 class="mb-0">Vérification OCR</h5>
            <select id="copy-select" class="form-select form-select-sm" style="width: 200px;">
                <option value="">Chargement...</option>
            </select>
        </div>
        <div>
            <span id="save-status" class="badge bg-secondary">Prêt</span>
            <button id="cancel-btn" class="btn btn-outline-secondary btn-sm ms-2">Annuler modifications</button>
            <button id="save-all-btn" class="btn btn-success btn-sm ms-2">Reconstruire extraction.md</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content-area">
        <!-- PDF Viewer -->
        <div class="pdf-panel">
            <!-- Page Selector -->
            <div class="page-selector" id="page-selector"></div>
            <div class="pdf-viewer-container">
                <img id="pdf-viewer" src="" style="max-width:100%;height:auto;object-fit:scale-down;background:#f8f9fa;">
            </div>
        </div>

        <!-- Markdown Editor -->
        <div class="editor-panel">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="fw-bold">Contenu Markdown (Page <span id="current-page-num">-</span>)</span>
                <button id="toggle-preview-btn" class="btn btn-sm btn-outline-secondary">👁️ Aperçu</button>
            </div>
            <textarea id="markdown-editor" spellcheck="false"></textarea>
            <div id="markdown-preview"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let currentCopy = null;
    let currentPage = null;
    let pagesData = {}; // {page_num: content}
    let originalPagesData = {}; // {page_num: original_content} for cancel
    let totalPages = 0;
    let isPreviewMode = false;
    
    const copySelect = document.getElementById('copy-select');
    const pageSelector = document.getElementById('page-selector');
    const pdfViewer = document.getElementById('pdf-viewer');
    const markdownEditor = document.getElementById('markdown-editor');
    const markdownPreview = document.getElementById('markdown-preview');
    const togglePreviewBtn = document.getElementById('toggle-preview-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const saveAllBtn = document.getElementById('save-all-btn');
    const currentPageNum = document.getElementById('current-page-num');
    const saveStatus = document.getElementById('save-status');

    document.addEventListener('DOMContentLoaded', async () => {
        await loadCopies();
        
        copySelect.addEventListener('change', loadCopyData);
        togglePreviewBtn.addEventListener('click', togglePreview);
        cancelBtn.addEventListener('click', cancelModifications);
        saveAllBtn.addEventListener('click', saveAllPages);
        
        // Track if current page has unsaved changes
        markdownEditor.addEventListener('input', () => {
            if (currentCopy && currentPage) {
                pagesData[currentPage] = markdownEditor.value;
                console.log("Updated pagesData[" + currentPage + "]");
            } else {
                console.log("No currentCopy or currentPage yet");
            }
            setSaveStatus("Modifié", "warning");
        });
    });

    async function loadCopies() {
        try {
            const res = await fetch('/api/ocr/copies');
            const copies = await res.json();
            
            copySelect.innerHTML = '<option value="">-- Choisir une copie --</option>';
            copies.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.innerText = c;
                copySelect.appendChild(opt);
            });
        } catch (e) {
            console.error("Erreur chargement copies:", e);
        }
    }

    async function loadCopyData() {
        const copyId = copySelect.value;
        if (!copyId) {
            currentCopy = null;
            resetUI();
            return;
        }
        
        // Save current page if it has unsaved changes before switching copies
        if (currentCopy && currentPage && pagesData[currentPage] !== originalPagesData[currentPage]) {
            setSaveStatus("Enregistrement de la page en cours...", "info");
            try {
                await saveCurrentPage();
                // Also update original after save
                originalPagesData[currentPage] = pagesData[currentPage];
            } catch (e) {
                console.error("Erreur sauvegarde avant changement de copie:", e);
            }
        }
        
        // Always rebuild extraction.md when switching copies to ensure it's up to date
        await saveAllPages();
        
        currentCopy = copyId;
        setSaveStatus("Chargement...", "info");
        
        try {
            // 1. PDF will be loaded when page is selected
            // Start with empty
            pdfViewer.src = "";
            
            // 2. Get pages list
            const res = await fetch(`/api/ocr/pages/${copyId}`);
            const data = await res.json();
            pagesData = {...data.pages};
            originalPagesData = {...data.pages};  // Store originals for cancel
            totalPages = data.total_pages || Object.keys(pagesData).length;
            
            // 3. Populate page selector
            populatePageSelector();
            
            // 4. Select first page with content or first page
            const firstPage = Object.keys(pagesData).sort((a, b) => a - b)[0] || "1";
            if (firstPage) {
                await loadPage(firstPage);
            }
            
            setSaveStatus("Prêt", "secondary");
        } catch (e) {
            console.error("Erreur chargement données copie:", e);
            setSaveStatus("Erreur", "danger");
        }
    }

    function populatePageSelector() {
        pageSelector.innerHTML = '';
        
        // Create buttons for all pages
        for (let i = 1; i <= totalPages; i++) {
            const pageNum = i.toString();
            const hasContent = pagesData[pageNum] !== undefined;
            
            const btn = document.createElement('button');
            btn.className = `page-btn ${hasContent ? 'has-content' : ''}`;
            btn.innerText = `Page ${i}`;
            btn.dataset.page = pageNum;
            
            btn.addEventListener('click', () => loadPage(pageNum));
            
            pageSelector.appendChild(btn);
        }
    }

    async function loadPage(pageNum) {
        if (!currentCopy || !pageNum) return;
        
        // Save previous page if it has unsaved changes
        if (currentPage && pagesData[currentPage] !== originalPagesData[currentPage]) {
            console.log("Saving page", currentPage, "before switching to", pageNum);
            await saveCurrentPage();
            // Also update original after save
            originalPagesData[currentPage] = pagesData[currentPage];
        }
        
        // Always rebuild extraction.md when switching pages to ensure it's up to date
        await saveAllPages();
        
        currentPage = pageNum;
        currentPageNum.innerText = pageNum;
        
        // Update active button
        document.querySelectorAll('.page-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.page === pageNum);
        });
        
        // Update PDF viewer to show the specific page as an image
        const pdfUrl = `/api/ocr/pdf/${currentCopy}?page=${pageNum}&t=` + Date.now();
        pdfViewer.src = pdfUrl;
        
        // Load markdown content
        try {
            const res = await fetch(`/api/ocr/content/${currentCopy}/${pageNum}`);
            const data = await res.json();
            markdownEditor.value = data.content || "";
            
            // Update pagesData and originalPagesData
            const content = data.content || "";
            pagesData[pageNum] = content;
            originalPagesData[pageNum] = content;
            
            // Update button state
            const btn = document.querySelector(`.page-btn[data-page="${pageNum}"]`);
            if (btn) {
                btn.classList.toggle('has-content', !!content);
            }
            
            // Reset preview mode
            if (isPreviewMode) {
                togglePreview();
            }
            
            setSaveStatus("Prêt", "secondary");
        } catch (e) {
            console.error("Erreur chargement page:", e);
            markdownEditor.value = "";
            setSaveStatus("Erreur", "danger");
        }
    }

    async function saveCurrentPage() {
        if (!currentCopy || !currentPage) return;
        
        const content = markdownEditor.value;
        pagesData[currentPage] = content;
        
        setSaveStatus("Enregistrement...", "info");
        
        try {
            await fetch(`/api/ocr/content/${currentCopy}/${currentPage}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content })
            });
            
            // Update button state
            const btn = document.querySelector(`.page-btn[data-page="${currentPage}"]`);
            if (btn) {
                btn.classList.add('has-content');
            }
            
            // Update original data after save
            originalPagesData[currentPage] = content;
            pagesData[currentPage] = content;
            
            setSaveStatus("Page enregistrée !", "success");
            setTimeout(() => setSaveStatus("Prêt", "secondary"), 2000);
        } catch (e) {
            console.error("Erreur sauvegarde page:", e);
            setSaveStatus("Erreur sauvegarde", "danger");
        }
    }

    async function saveAllPages() {
        if (!currentCopy) return;
        
        setSaveStatus("Reconstruction extraction.md...", "info");
        
        try {
            const res = await fetch(`/api/ocr/rebuild_extraction/${currentCopy}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pages: pagesData })
            });
            
            const data = await res.json();
            if (data.success) {
                setSaveStatus("extraction.md reconstruit !", "success");
                setTimeout(() => setSaveStatus("Prêt", "secondary"), 2000);
            } else {
                throw new Error(data.error || "Erreur");
            }
        } catch (e) {
            console.error("Erreur reconstruction:", e);
            setSaveStatus("Erreur reconstruction", "danger");
        }
    }

    function cancelModifications() {
        if (!currentCopy || !currentPage) return;
        
        // Restore original content for current page
        const originalContent = originalPagesData[currentPage] || "";
        markdownEditor.value = originalContent;
        pagesData[currentPage] = originalContent;
        
        setSaveStatus("Modifications annulées", "success");
        setTimeout(() => setSaveStatus("Prêt", "secondary"), 2000);
    }

    function togglePreview() {
        isPreviewMode = !isPreviewMode;
        if (isPreviewMode) {
            const markdownText = markdownEditor.value;
            markdownPreview.innerHTML = marked.parse(markdownText);
            
            if (window.MathJax) {
                MathJax.typesetPromise([markdownPreview]).catch((err) => console.log(err));
            }
            
            markdownEditor.style.display = 'none';
            markdownPreview.style.display = 'block';
            togglePreviewBtn.innerHTML = "📝 Editer";
            togglePreviewBtn.classList.replace('btn-outline-secondary', 'btn-secondary');
        } else {
            markdownEditor.style.display = 'block';
            markdownPreview.style.display = 'none';
            togglePreviewBtn.innerHTML = "👁️ Aperçu";
            togglePreviewBtn.classList.replace('btn-secondary', 'btn-outline-secondary');
        }
    }

    function resetUI() {
        pdfViewer.src = "";
        markdownEditor.value = "";
        markdownPreview.innerHTML = "";
        pageSelector.innerHTML = "";
        currentPageNum.innerText = "-";
    }

    function setSaveStatus(text, colorClass) {
        saveStatus.innerText = text;
        saveStatus.className = `badge bg-${colorClass}`;
    }
</script>
{% endblock %}
