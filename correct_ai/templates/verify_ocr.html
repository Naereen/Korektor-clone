{% extends "layout.html" %}

{% block extra_css %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
    .main-container-ocr {
        height: calc(100vh - 80px);
        display: flex;
        flex-direction: column;
        background: white;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        overflow: hidden;
    }
    .toolbar {
        padding: 10px;
        background-color: #f8f9fa;
        border-bottom: 1px solid #dee2e6;
    }
    .content-area {
        flex: 1;
        display: flex;
        overflow: hidden;
    }
    .pdf-panel {
        flex: 1;
        border-right: 1px solid #dee2e6;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .editor-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 15px;
        background-color: #fff;
    }
    .page-selector {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        padding: 10px;
        background: #f8f9fa;
        border-bottom: 1px solid #dee2e6;
        overflow-y: auto;
        min-height: 50px;
        max-height: 120px;
    }
    .pdf-viewer-container {
        flex: 1;
        overflow: auto;
        min-height: 0;
    }
    .page-btn {
        padding: 5px 10px;
        border: 1px solid #dee2e6;
        background: white;
        cursor: pointer;
        border-radius: 4px;
        transition: all 0.2s;
    }
    .page-btn:hover { background: #e9ecef; }
    .page-btn.active { background: #4f46e5; color: white; border-color: #4f46e5; }
    .page-btn.has-content { font-weight: bold; }
    .page-btn.unsaved { border-color: #ffc107; background: #fff3cd; }
    .editor-panel .CodeMirror {
        flex: 1;
        width: 100%;
        min-height: 0;
        font-family: monospace;
        font-size: 0.85rem;
        border: 1px solid #ced4da;
        border-radius: 0.25rem;
    }
    #markdown-preview {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        border: 1px solid #ced4da;
        border-radius: 0.25rem;
        display: none;
        background-color: #f8f9fa;
        font-family: system-ui, -apple-system, sans-serif;
    }
    #markdown-preview pre {
        position: relative;
        overflow-x: auto;
        border-radius: 0.25rem;
    }
    #markdown-preview pre[data-language]::before {
        content: attr(data-language);
        position: absolute;
        top: 0.4rem;
        right: 0.65rem;
        color: #9da7b3;
        font: 0.7rem/1.2 system-ui, -apple-system, sans-serif;
        text-transform: lowercase;
    }
    #markdown-preview pre code.hljs {
        padding-top: 2rem;
    }
    .action-bar {
        display: flex;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid #dee2e6;
    }
    .latex-errors {
        display: none;
        padding: 5px 10px;
        background: #fff3cd;
        border: 1px solid #ffc107;
        border-radius: 4px;
        font-size: 0.8rem;
        margin-top: 5px;
    }
    .latex-errors.has-errors { display: block; }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/ocaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/latex.min.js"></script>
<script>
    MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
        options: { ignoreHtmlClass: 'no-mathjax' }
    };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endblock %}

{% block content %}
<div id="unsaved-modal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header"><h6 class="modal-title">Modifications non enregistrées</h6></div>
            <div class="modal-body small">Voulez-vous sauvegarder les modifications avant de continuer ?</div>
            <div class="modal-footer">
                <button class="btn btn-outline-danger btn-sm" data-action="discard">Abandonner les modifications</button>
                <button class="btn btn-primary btn-sm" data-action="save">Sauvegarder</button>
            </div>
        </div>
    </div>
</div>

<div class="main-container-ocr">
    <div class="toolbar d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-3">
            <h3 class="mb-0">Vérification OCR</h3>
            <!-- Sélecteur de copie d'examen -->
            <div class="d-flex align-items-center gap-1">
                <button id="prev-copy-btn" class="btn btn-outline-secondary btn-sm" title="Copie précédente">
                    ◀
                </button>
                <select id="copy-select" class="form-select form-select-sm" style="width: 200px;">
                    <option value="">Chargement...</option>
                </select>
                <button id="next-copy-btn" class="btn btn-outline-secondary btn-sm" title="Copie suivante">
                    ▶
                </button>
            </div>
        </div>
        <div class="d-flex align-items-center gap-2">
            <div class="text-center">
                <h5 id="student-name" class="mb-0 text-muted"></h5>
                <div id="ocr-built-at" class="small text-muted" aria-live="polite"></div>
            </div>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span id="save-status" class="badge bg-secondary">Prêt</span>
            <button id="cancel-btn" class="btn btn-outline-danger btn-sm">Annuler</button>
            <button id="save-btn" class="btn btn-primary btn-sm">Sauvegarder</button>
            <button id="rebuild-btn" class="btn btn-success btn-sm">Reconstruire le <code>extraction.md</code></button>
            <button id="finish-btn" class="btn btn-dark btn-sm">
                Terminer et lancer la correction <i class="bi bi-arrow-right"></i>
            </button>
        </div>
    </div>

    <div class="content-area">
        <div class="pdf-panel">
            <div class="page-selector" id="page-selector"></div>
            <div class="pdf-viewer-container">
                <img id="pdf-viewer" src="" style="max-width:100%;height:auto;object-fit:scale-down;background:#f8f9fa;">
            </div>
        </div>

        <div class="editor-panel">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="fw-bold">Page <span id="current-page-num">-</span></span>
                <button id="toggle-preview-btn" class="btn btn-sm btn-outline-secondary">Aperçu</button>
            </div>
            <textarea id="markdown-editor" spellcheck="false"></textarea>
            <div id="markdown-preview"></div>
            <div id="latex-errors" class="latex-errors"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<script>
let currentCopy = null;
let currentPage = null;
let pagesData = {};
let originalPagesData = {};
let hasUnsavedChanges = false;
let totalPages = 0;
let isPreviewMode = false;
let pendingAction = null;  // {type: 'copy'|'page'|'leave', target: ...}
let afterSaveCallback = null;

const copySelect = document.getElementById('copy-select');
const prevCopyBtn = document.getElementById('prev-copy-btn');
const nextCopyBtn = document.getElementById('next-copy-btn');
const studentName = document.getElementById('student-name');
const ocrBuiltAt = document.getElementById('ocr-built-at');
function showOcrBuiltAt(value) {
    ocrBuiltAt.textContent = value
        ? `OCR construit le ${new Date(value).toLocaleString('fr-FR', {dateStyle: 'short', timeStyle: 'short'})}`
        : 'OCR : date indisponible';
}
const pageSelector = document.getElementById('page-selector');
const pdfViewer = document.getElementById('pdf-viewer');
const markdownEditor = document.getElementById('markdown-editor');
const editor = CodeMirror.fromTextArea(markdownEditor, {
    mode: 'markdown',
    lineNumbers: true,
    lineWrapping: true,
});
const markdownPreview = document.getElementById('markdown-preview');
const togglePreviewBtn = document.getElementById('toggle-preview-btn');
const cancelBtn = document.getElementById('cancel-btn');
const saveBtn = document.getElementById('save-btn');
const rebuildBtn = document.getElementById('rebuild-btn');
const finishBtn = document.getElementById('finish-btn');
const currentPageNum = document.getElementById('current-page-num');
const saveStatus = document.getElementById('save-status');
const latexErrors = document.getElementById('latex-errors');
const unsavedModal = new bootstrap.Modal(document.getElementById('unsaved-modal'));

// === Init ===
document.addEventListener('DOMContentLoaded', async () => {
    await loadCopies();
    copySelect.addEventListener('change', () => switchCopy(copySelect.value));
    prevCopyBtn.addEventListener('click', () => switchToAdjacentCopy(-1));
    nextCopyBtn.addEventListener('click', () => switchToAdjacentCopy(1));
    togglePreviewBtn.addEventListener('click', togglePreview);
    cancelBtn.addEventListener('click', confirmCancel);
    saveBtn.addEventListener('click', saveCurrentPage);
    rebuildBtn.addEventListener('click', rebuildExtraction);
    finishBtn.addEventListener('click', finishVerification);
    editor.on('change', onEditorChange);

    // Modal buttons
    document.querySelector('[data-action="save"]').addEventListener('click', () => {
        unsavedModal.hide();
        saveCurrentPage().then(saved => {
            if (saved) executePendingAction();
        });
    });
    document.querySelector('[data-action="discard"]').addEventListener('click', () => {
        unsavedModal.hide();
        hasUnsavedChanges = false;
        markDirty(false);
        executePendingAction();
    });

    // Warning on tab close
    window.addEventListener('beforeunload', (e) => {
        if (hasUnsavedChanges) {
            e.preventDefault();
            e.returnValue = '';
        }
    });
});

// === Copies ===
async function loadStudentName(copyId) {
    studentName.innerText = copyId;
    try {
        const res = await fetch(`/api/ocr/student/${copyId}`);
        const data = await res.json();
        if (data.name || data.firstname) studentName.innerText = `${data.firstname} ${data.name}`.trim();
    } catch(e) { console.error(e); }
}

async function loadCopies() {
    try {
        const res = await fetch('/api/ocr/copies');
        const copies = await res.json();
        copySelect.innerHTML = '<option value="">-- Choisir une copie --</option>';
        const students = await Promise.all(copies.map(async copyId => {
            try {
                const studentRes = await fetch(`/api/ocr/student/${copyId}`);
                return studentRes.ok ? await studentRes.json() : null;
            } catch (e) {
                console.error(e);
                return null;
            }
        }));
        copies.forEach((copyId, index) => {
            const opt = document.createElement('option');
            const student = students[index];
            const name = [student?.firstname, student?.name].filter(Boolean).join(' ');
            opt.value = copyId;
            opt.innerText = name ? `${copyId} - ${name}` : copyId;
            copySelect.appendChild(opt);
        });
    } catch(e) { console.error(e); }
}

// === Navigation avec confirmation ===
function switchToAdjacentCopy(offset) {
    const options = Array.from(copySelect.options).filter(o => o.value);
    if (!options.length) return;
    const currentIndex = options.findIndex(o => o.value === copySelect.value);
    const newIndex = currentIndex + offset;
    if (newIndex < 0 || newIndex >= options.length) return;
    copySelect.value = options[newIndex].value;
    switchCopy(copySelect.value);
}

async function switchCopy(copyId) {
    if (!copyId) { currentCopy = null; studentName.innerText = ''; showOcrBuiltAt(null); resetUI(); return; }
    if (hasUnsavedChanges && currentCopy !== copyId) {
        pendingAction = { type: 'copy', target: copyId };
        unsavedModal.show();
        return;
    }
    await doSwitchCopy(copyId);
}

async function doSwitchCopy(copyId) {
    currentCopy = copyId;
    showOcrBuiltAt(null);
    hasUnsavedChanges = false;
    setSaveStatus("Chargement...", "info");
    loadStudentName(copyId);
    try {
        pdfViewer.src = "";
        const res = await fetch(`/api/ocr/pages/${copyId}`);
        const data = await res.json();
        showOcrBuiltAt(data.built_at);
        pagesData = {...data.pages};
        originalPagesData = {...data.pages};
        totalPages = data.total_pages || Object.keys(pagesData).length;
        populatePageSelector();
        const firstPage = Object.keys(pagesData).sort((a, b) => a - b)[0] || "1";
        if (firstPage) await loadPage(firstPage);
        setSaveStatus("Prêt", "secondary");
    } catch(e) { console.error(e); setSaveStatus("Erreur", "danger"); }
}

async function switchPage(pageNum) {
    if (!currentCopy || !pageNum) return;
    if (hasUnsavedChanges && pageNum !== currentPage) {
        pendingAction = { type: 'page', target: pageNum };
        unsavedModal.show();
        return;
    }
    await doSwitchPage(pageNum);
}

async function doSwitchPage(pageNum) {
    currentPage = pageNum;
    hasUnsavedChanges = false;
    markDirty(false);
    currentPageNum.innerText = pageNum;
    document.querySelectorAll('.page-btn').forEach(b => b.classList.toggle('active', b.dataset.page === pageNum));
    pdfViewer.src = `/api/ocr/pdf/${currentCopy}?page=${pageNum}&t=` + Date.now();
    // scrollTop is on the scrollable container, not the img itself
    document.querySelector('.pdf-viewer-container').scrollTop = 0;
    try {
        const res = await fetch(`/api/ocr/content/${currentCopy}/${pageNum}`);
        const data = await res.json();
        const content = data.content || "";
        editor.setValue(content);
        pagesData[pageNum] = content;
        originalPagesData[pageNum] = content;
        updatePageButton(pageNum, !!content, false);
        if (isPreviewMode) togglePreview();
        setSaveStatus("Prêt", "secondary");
    } catch(e) { console.error(e); setSaveStatus("Erreur", "danger"); }
}

function executePendingAction() {
    if (!pendingAction) return;
    const action = pendingAction;
    const callback = afterSaveCallback;
    pendingAction = null;
    afterSaveCallback = null;
    if (callback) callback();
    else if (action.type === 'copy') doSwitchCopy(action.target);
    else if (action.type === 'page') doSwitchPage(action.target);
}

// === Page Selector ===
function populatePageSelector() {
    pageSelector.innerHTML = '';
    for (let i = 1; i <= totalPages; i++) {
        const pageNum = i.toString();
        const hasContent = pagesData[pageNum] !== undefined && pagesData[pageNum].length > 0;
        const btn = document.createElement('button');
        btn.className = `page-btn ${hasContent ? 'has-content' : ''} ${i <= 1 ? 'active' : ''}`;
        if (i <= 1) { btn.classList.add('active'); }
        btn.innerText = `Page ${i}/${totalPages}`;
        btn.dataset.page = pageNum;
        btn.addEventListener('click', () => switchPage(pageNum));
        pageSelector.appendChild(btn);
    }
}

function updatePageButton(pageNum, hasContent, isDirty) {
    const btn = document.querySelector(`.page-btn[data-page="${pageNum}"]`);
    if (!btn) return;
    btn.classList.toggle('has-content', hasContent);
    btn.classList.toggle('unsaved', isDirty);
}

// === Save ===
async function saveCurrentPage() {
    if (!currentCopy || !currentPage) return true;
    const content = editor.getValue();
    pagesData[currentPage] = content;
    setSaveStatus("Enregistrement...", "info");
    try {
        const response = await fetch(`/api/ocr/content/${currentCopy}/${currentPage}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({content})
        });
        if (!response.ok) throw new Error(await response.text());
        originalPagesData[currentPage] = content;
        hasUnsavedChanges = false;
        markDirty(false);
        updatePageButton(currentPage, !!content, false);
        setSaveStatus("Enregistré !", "success");
        setTimeout(() => setSaveStatus("Prêt", "secondary"), 2000);
        return true;
    } catch(e) {
        console.error(e);
        setSaveStatus("Erreur lors de l'enregistrement", "danger");
        return false;
    }
}

async function rebuildExtraction() {
    if (!currentCopy) return;
    if (hasUnsavedChanges) {
        pendingAction = { type: 'rebuild', target: null };
        afterSaveCallback = () => doRebuild();
        unsavedModal.show();
        return;
    }
    await doRebuild();
}

async function doRebuild() {
    setSaveStatus("Reconstruction...", "info");
    try {
        const res = await fetch(`/api/ocr/rebuild_extraction/${currentCopy}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({pages: pagesData})
        });
        const data = await res.json();
        if (data.success) {
            showOcrBuiltAt(data.built_at);
            setSaveStatus("extraction.md reconstruit !", "success");
            setTimeout(() => setSaveStatus("Prêt", "secondary"), 2000);
            return true;
        } else {
            throw new Error(data.error || "Erreur");
        }
    } catch(e) {
        console.error(e);
        setSaveStatus("Erreur", "danger");
        return false;
    }
}

async function finishVerification() {
    finishBtn.disabled = true;
    if (hasUnsavedChanges && !await saveCurrentPage()) {
        finishBtn.disabled = false;
        return;
    }
    if (currentCopy && !await doRebuild()) {
        finishBtn.disabled = false;
        return;
    }
    window.location.href = '/correction';
}

// === Cancel (Annuler) ===
function confirmCancel() {
    if (!currentCopy || !currentPage) return;
    if (!hasUnsavedChanges) { setSaveStatus("Aucune modification", "secondary"); return; }
    if (!confirm("Annuler les modifications de cette page ? Le contenu reviendra à l'état de la dernière sauvegarde.")) return;
    cancelCurrentPage();
}

function cancelCurrentPage() {
    const originalContent = originalPagesData[currentPage] || "";
    editor.setValue(originalContent);
    pagesData[currentPage] = originalContent;
    hasUnsavedChanges = false;
    markDirty(false);
    updatePageButton(currentPage, !!originalContent, false);
    setSaveStatus("Modifications annulées", "success");
    setTimeout(() => setSaveStatus("Prêt", "secondary"), 2000);
}

// === Editor Change ===
function onEditorChange(instance, change) {
    if (change.origin === 'setValue') return;
    if (!currentCopy || !currentPage) return;
    if (isPreviewMode) renderMarkdownPreview(editor.getValue());
    hasUnsavedChanges = true;
    markDirty(true);
    updatePageButton(currentPage, true, true);
    setSaveStatus("Modifié", "warning");
}

function markDirty(dirty) {
    document.querySelectorAll('.page-btn').forEach(b => b.classList.toggle('unsaved', false));
    if (dirty && currentPage) {
        const btn = document.querySelector(`.page-btn[data-page="${currentPage}"]`);
        if (btn) btn.classList.add('unsaved');
    }
}

// === Preview + LaTeX check ===
function renderMarkdownPreview(markdownText) {
    markdownPreview.innerHTML = marked.parse(markdownText);
    markdownPreview.querySelectorAll('pre code').forEach((block) => {
        const languageClass = Array.from(block.classList).find(name => name.startsWith('language-'));
        const requestedLanguage = languageClass ? languageClass.slice('language-'.length) : '';
        const language = requestedLanguage && hljs.getLanguage(requestedLanguage) ? requestedLanguage : 'plaintext';
        if (languageClass) block.classList.remove(languageClass);
        block.classList.add(`language-${language}`);
        block.parentElement.dataset.language = language;
        hljs.highlightElement(block);
    });
}

function togglePreview() {
    isPreviewMode = !isPreviewMode;
    if (isPreviewMode) {
        renderMarkdownPreview(editor.getValue());
        if (window.MathJax) {
            MathJax.typesetPromise([markdownPreview]).then(() => {
                checkLatexErrors();
            }).catch(() => checkLatexErrors());
        }
        editor.getWrapperElement().style.display = 'none';
        markdownPreview.style.display = 'block';
        togglePreviewBtn.innerHTML = "Editer";
        togglePreviewBtn.classList.replace('btn-outline-secondary', 'btn-secondary');
    } else {
        editor.getWrapperElement().style.display = '';
        editor.refresh();
        markdownPreview.style.display = 'none';
        latexErrors.style.display = 'none';
        togglePreviewBtn.innerHTML = "Aperçu";
        togglePreviewBtn.classList.replace('btn-secondary', 'btn-outline-secondary');
    }
}

function checkLatexErrors() {
    // Detect common LaTeX issues in the preview
    const html = markdownPreview.innerHTML;
    const issues = [];
    // Check for [Math Processing Error] which MathJax inserts on failure
    if (html.includes('Math Processing Error')) issues.push('Erreur de rendu LaTeX detectee');
    // Check for unbalanced $ signs (simple heuristic)
    const text = editor.getValue();
    const dollars = (text.match(/\$/g) || []).length;
    if (dollars % 2 !== 0) issues.push('Nombre impair de $ - verifier les formules LaTeX');
    // Check for unescaped backslashes that might cause issues
    const singleBackslash = (text.match(/(?<!\\)\\(?!["\\{}()[\]])/g) || []).length;
    if (singleBackslash > 0) issues.push('Backslashs non échappés détectés !');

    latexErrors.innerHTML = issues.map(i => '<div>' + i + '</div>').join('');
    latexErrors.classList.toggle('has-errors', issues.length > 0);
}

// === UI Helpers ===
function resetUI() {
    pdfViewer.src = "";
    editor.setValue("");
    markdownPreview.innerHTML = "";
    pageSelector.innerHTML = "";
    currentPageNum.innerText = "-";
    studentName.innerText = "";
    hasUnsavedChanges = false;
}

function loadPage(pageNum) { switchPage(pageNum); }

function setSaveStatus(text, colorClass) {
    saveStatus.innerText = text;
    saveStatus.className = `badge bg-${colorClass}`;
}
</script>
{% endblock %}
