<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CorrectAI - Correction d'Examens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar-brand {
            font-weight: bold;
            color: #4f46e5 !important;
        }

        .nav-link.active {
            font-weight: bold;
            color: #4f46e5 !important;
            border-bottom: 2px solid #4f46e5;
        }

        .main-container {
            padding: 20px;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <div id="loading" class="loading-overlay">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Chargement...</span>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">CorrectAI</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'import' %}active{% endif %}" href="/import">
                            <i class="bi bi-upload"></i> Import
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'split' %}active{% endif %}" href="/split">
                            <i class="bi bi-scissors"></i> Découpage
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'ocr' %}active{% endif %}" href="/ocr">
                            <i class="bi bi-eye"></i> OCR
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'verify_ocr' %}active{% endif %}" href="/verify_ocr">
                            <i class="bi bi-file-earmark-text"></i> Vérif OCR
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'correction' %}active{% endif %}" href="/correction">
                            <i class="bi bi-robot"></i> Correction
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'verify' %}active{% endif %}" href="/verify">
                            <i class="bi bi-check2-all"></i> Vérif Correction
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'bilan' %}active{% endif %}" href="/bilan">
                            <i class="bi bi-bar-chart-fill"></i> Bilan
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid main-container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showLoading() { document.getElementById('loading').style.display = 'flex'; }
        function hideLoading() { document.getElementById('loading').style.display = 'none'; }
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
