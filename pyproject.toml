[project]
name = "korektor"
version = "0.3.0"
description = "Assistant IA de correction de copies manuscrites"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask",
    "pymupdf",
    "pypdf",
    "requests",
    "google-genai",
    "json-repair",
    "tiktoken",
    "matplotlib",
    "pillow",
    "typst>=0.15,<0.16",
]

[dependency-groups]
dev = [
    "pytest",
    "black",
    "isort",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.isort]
line_length = 100

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''